# S4 endogenous adoption sensitivity — design lock
# Locked before any formal output. Sources: Claire/experiment_plans/S4_endogenous_adoption_sensitivity.md
experiment: s4_endogenous
locked_at: "2026-08-13"
plan_source: Claire/experiment_plans/S4_endogenous_adoption_sensitivity.md

event:
  chain: base
  chain_id: "eip155:8453"
  platform: clanker
  anchor: "Clanker v4.1 first observed 2025-08-26 20:41:57 UTC"

inputs:
  launches: data/canonical/v1/base/launches/part-00000.parquet
  protocol_config: data/canonical/v1/base/protocol_config/part-00000.parquet
  coverage_ledger: data/canonical/v1/base/coverage_ledger/part-00000.parquet

sample:
  unit: creator-day
  outcome: "log1p(daily launch count)"
  observed_window: ["2025-08-18", "2025-10-01"]
  calibration_pre_period: ["2025-08-18", "2025-09-07"]   # 21 days
  eligibility: ">=3 launches in calibration pre-period; no post-period activity used"
  accepted_versions: ["v4.0_mev_or_hook", "v4.1_mev_or_hook"]
  never_v41_definition: "eligible creator with zero v4.1_mev_or_hook launches over the full observed window"
  expected_counts: {eligible: 1379, never_v41: 1121}   # audit values; pipeline recomputes

dgp:
  panel_days: 60
  pseudo_calendar_start: "2025-08-18"   # Monday; fixes weekday-effect alignment
  relative_adoption_days: [24, 25, 26, 27, 28, 29, 30, 31]
  cohort_size_proportions_source: "empirical first-v4.1 distribution among eligible creators, 2025-09-24..2025-10-01"
  outcome_model: "y0[i,d] = a_i + weekday[dow(d)] + b_i*(d - 9.5) + resid60[i,d]"
  baseline_and_slopes: "per-creator OLS of (y - weekday) on [1, t-9.5] over the 21-day pre panel; weekday effects = two-way FE, mean-zero normalized"
  residuals: "block bootstrap: per pseudo creator draw one never-v4.1 creator residual block (21 values), random circular shift, tile to 60 days"
  latent_slope: "b_i kept as latent; measurement noise retained via empirical slope distribution"
  propensity: "p_i = logit^-1(a + gamma * standardized(b_i)); a solved by bisection so mean p_i = 0.40"
  treated_share_gate: [0.35, 0.45]   # if violated, adjust intercept a only, never gamma
  severities: {none: 0.0, moderate: 0.75, strong: 1.5}
  arms: {zero: 0.0, positive: 0.20}  # constant log effect added from adoption day onward
  oracle_saved: [b_i, y0, propensity, injected_effect, true_ATT]
  estimator_input_columns: [id, t, y, g]  # b_i and propensity never included

estimand:
  target: "group-size-weighted ATT at event time 0 on log1p scale"
  true_value: {zero_arm: 0.0, positive_arm: 0.20}

methods:
  twfe:
    impl: "base R two-way within OLS, post indicator, cluster-robust SE by creator"
  cs:
    package: {name: did, version: "2.1.2"}
    att_gt:
      control_group: nevertreated
      base_period: universal
      est_method: reg
      anticipation: 0
      panel: true
    aggte: {type: dynamic, min_e: -7, max_e: 7, balance_e: 7}
    extracted: "event-time-0 ATT and SE from the dynamic AGGTEobj"
  sensitivity:
    package: {name: HonestDiD, version: "0.2.8"}
    call: 'honest_did(es, e=0, type="relative_magnitude", Mbarvec=c(0.5,1,1.5,2), gridPoints=100)'
    primary_deviation: 1.0
  diagnostics: [event_time_leads, pre_period_slope_difference, pretrend_joint_wald_test]
  unestimable_rule: "if universal base period or continuous event-time support fails, mark replication unestimable; no algorithm swap"

monte_carlo:
  replications_per_cell: 2000
  cells: "3 severities x 2 arms = 6"
  seed_scheme: "seed = first 8 bytes of sha256('S4|<gamma>|<arm>|<rep>') as uint32 -> numpy PCG64"
  batch_size: 50
  io_bridge: "binary float64/int32 payloads + JSON meta between Python and Rscript (no extra R packages)"

deviations_from_plan_environment:
  - "R installed via Homebrew after explicit user approval 2026-08-13; R 4.6.1"
  - "Python 3.12.13 via uv-managed interpreter; experiment-local venv; packages numpy, pandas, pyarrow only"
  - "R packages installed into experiment-local library R/library; did/HonestDiD dependencies (incl. data.table) compile from source, versions pinned by CRAN dependency resolution"
  - "static TWFE executed in R (estimation belongs to R per plan), implemented with base R within-transformation to avoid unapproved extra packages"
  - "inference mode not fixed by the plan: att_gt/aggte called with bstrap=FALSE, cband=FALSE (analytic IF-based pointwise SEs; honest_did uses the same IF VCV); locked estimator parameters unchanged"
  - "system build tools rust, cmake, glpk installed via Homebrew as compilation requirements of the approved CRAN packages"

metrics: [point_bias, rmse, conventional_coverage, sensitivity_coverage, false_definitive_claim_rate,
          unidentified_rate, supported_positive_rate, pretrend_test_power, robust_value_distribution,
          claim_accuracy, monte_carlo_se]

prohibited:
  - treating real v4.1 users as exogenously treated
  - exposing oracle latent slope to estimators
  - choosing sensitivity grid from results
  - claiming the sensitivity method identifies the effect
  - modifying shared data, manuscript, Wiki, dependencies, or git history
  - reading retired joint or archive synthetic artifacts
