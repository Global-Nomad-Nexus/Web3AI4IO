    <circle cx="1114" cy="441" r="31" fill="#fff" stroke="#c39325" stroke-width="2"/><circle cx="1114" cy="441" r="18" fill="#fff0c7" stroke="#c39325"/><circle cx="1114" cy="441" r="7" fill="#c39325"/>
