  <!-- Evidence ladder -->
  <text x="592" y="602" class="h2">Sequential evidence disclosure</text>
  <line x1="615" y1="654" x2="1240" y2="654" stroke="#d2dde4" stroke-width="5" stroke-linecap="round"/>
  <g text-anchor="middle">
    <circle cx="615" cy="654" r="24" fill="#3c8c75"/><text x="615" y="650" font-size="13" font-weight="700" fill="#fff">L0</text><text x="615" y="665" font-size="10.5" fill="#fff">naive</text>
    <circle cx="704" cy="654" r="24" fill="#cde4f4"/><text x="704" y="650" font-size="13" font-weight="700" fill="#315f73">L1</text><text x="704" y="665" font-size="10.5" fill="#315f73">control</text>
    <circle cx="793" cy="654" r="24" fill="#cde4f4"/><text x="793" y="650" font-size="13" font-weight="700" fill="#315f73">L2</text><text x="793" y="665" font-size="10.5" fill="#315f73">FE</text>
    <circle cx="882" cy="654" r="24" fill="#ffe4a0"/><text x="882" y="650" font-size="13" font-weight="700" fill="#6e551b">L3</text><text x="882" y="665" font-size="10.5" fill="#6e551b">dynamic</text>
    <circle cx="971" cy="654" r="24" fill="#f5d2dc"/><text x="971" y="650" font-size="13" font-weight="700" fill="#7e5362">L4</text><text x="971" y="665" font-size="10.5" fill="#7e5362">pretrend</text>
    <circle cx="1060" cy="654" r="24" fill="#e3daf3"/><text x="1060" y="650" font-size="13" font-weight="700" fill="#66558e">L5</text><text x="1060" y="665" font-size="10.5" fill="#66558e">hetero.</text>
    <circle cx="1149" cy="654" r="24" fill="#cde4f4"/><text x="1149" y="650" font-size="13" font-weight="700" fill="#315f73">L6</text><text x="1149" y="665" font-size="10.5" fill="#315f73">exact</text>
    <circle cx="1238" cy="654" r="27" fill="#6b5a9c"/><text x="1238" y="650" font-size="13" font-weight="700" fill="#fff">L7</text><text x="1238" y="665" font-size="10.5" fill="#fff">vector</text>
  </g>

