  <polygon points="614,873 642,873 658,895 642,917 614,917 598,895" fill="#6b5a9c"/>
  <text x="628" y="900" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">AI</text>
  <text x="680" y="888" font-size="16" font-weight="700" fill="#51467a">Evidence effects vary across models and evidence blocks</text>
  <text x="680" y="913" class="small">three-model blind factorial audit</text>

  <!-- C. Evidence-calibrated interpretation -->
  <text x="1316" y="68" class="panel-kicker">C</text>
  <text x="1344" y="69" class="panel-title">Evidence-calibrated interpretation</text>
  <text x="1316" y="95" class="body">Inference narrows activity evidence to bounded stakeholder interpretations.</text>
  <rect x="1316" y="111" width="56" height="3" rx="1.5" fill="#b46178"/>

  <!-- mini coefficient path -->
  <text x="1316" y="154" class="h2">Market-level estimate</text>
  <line x1="1360" y1="330" x2="1735" y2="330" stroke="#687d8d" stroke-width="1.7"/>
  <text x="1335" y="334" class="small">0</text>
  <line x1="1435" y1="195" x2="1435" y2="330" stroke="#3c8c75" stroke-width="3"/>
  <circle cx="1435" cy="225" r="12" fill="#3c8c75" stroke="#fff" stroke-width="2"/>
  <text x="1435" y="185" text-anchor="middle" class="small">before–after</text>
  <text x="1435" y="255" text-anchor="middle" class="num" fill="#2f7f6c">+0.669</text>

  <line x1="1605" y1="270" x2="1605" y2="368" stroke="#b46178" stroke-width="3"/>
  <line x1="1595" y1="270" x2="1615" y2="270" stroke="#b46178" stroke-width="3"/><line x1="1595" y1="368" x2="1615" y2="368" stroke="#b46178" stroke-width="3"/>
  <circle cx="1605" cy="314" r="12" fill="#b46178" stroke="#fff" stroke-width="2"/>
  <text x="1605" y="185" text-anchor="middle" class="small">controls + two-way FE</text>
  <text x="1605" y="235" text-anchor="middle" class="num" fill="#864e61">+0.412</text>
  <text x="1605" y="253" text-anchor="middle" class="tiny">95% CI [−0.128, 0.951]</text>

  <path d="M1460 225 C1500 225 1530 285 1580 307" fill="none" stroke="#8da1af" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="1336" y="392" width="414" height="72" rx="8" fill="#fff5f7" stroke="#db9aae" stroke-width="1.5"/>
  <text x="1543" y="421" text-anchor="middle" font-size="17" font-weight="700" fill="#874e61">CAUSAL EFFECT NOT IDENTIFIED</text>
  <text x="1543" y="445" text-anchor="middle" class="small">unstable pre-period · four clusters · exact p = 0.6875</text>

  <!-- retained evidence -->
  <text x="1316" y="520" class="h2">Evidence that remains informative</text>
  <rect x="1336" y="550" width="414" height="112" rx="8" fill="#dcebfa" stroke="#95bada" stroke-width="1.4"/>
  <circle cx="1382" cy="606" r="25" fill="#fff" stroke="#5084ab" stroke-width="2"/><circle cx="1382" cy="606" r="15" fill="#5084ab"/><path d="M1375 606 L1380 612 L1390 599" fill="none" stroke="#fff" stroke-width="2.6"/>
  <text x="1422" y="581" class="h3">Operational mechanism</text><text x="1422" y="617" class="num" fill="#315f73">1,636 / 1,651</text><text x="1422" y="640" class="small">observed 30-day transaction-proxy activity</text>

  <rect x="1336" y="684" width="414" height="112" rx="8" fill="#fff0c7" stroke="#dfbe62" stroke-width="1.4"/>
  <circle cx="1382" cy="740" r="24" fill="#c39325"/><path d="M1372 748 L1392 728 M1381 728 L1392 728 L1392 739" fill="none" stroke="#fff" stroke-width="2.5"/>
  <text x="1422" y="715" class="h3">Predictive marker</text><text x="1422" y="751" class="num" fill="#675625">+0.945 pp</text><text x="1422" y="774" class="small">predictive association; causal exposure not established</text>

  <!-- stakeholder vector -->
  <text x="1316" y="846" class="h2">Stakeholder interpretation vector</text>
  <g>
    <rect x="1336" y="870" width="96" height="64" rx="7" fill="#d8f3ea" stroke="#8dcdb9"/><circle cx="1353" cy="890" r="5" fill="#3c8c75"/><text x="1365" y="894" class="h3">Creator</text><text x="1384" y="920" text-anchor="middle" class="tiny">mechanical</text>
    <rect x="1442" y="870" width="96" height="64" rx="7" fill="#fadde4" stroke="#daa0b1"/><circle cx="1459" cy="890" r="5" fill="#b46178"/><text x="1471" y="894" class="h3">Trader</text><text x="1490" y="920" text-anchor="middle" class="tiny">unresolved</text>
    <rect x="1548" y="870" width="96" height="64" rx="7" fill="#dcebfa" stroke="#9abbd7"/><circle cx="1565" cy="890" r="5" fill="#5084ab"/><text x="1577" y="894" class="h3">Platform</text><text x="1596" y="920" text-anchor="middle" class="tiny">venue active</text>
