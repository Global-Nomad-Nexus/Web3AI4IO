<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 20 1800 920" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Trustworthy causal evaluation for token launch platforms</title>
  <desc id="svg-desc">Multichain evidence infrastructure, a three-pillar evaluation framework, and evidence-calibrated interpretation.</desc>
  <defs>
