  <path d="M910 160 L690 458 L1130 458 Z" fill="#f7fafb" stroke="#d5e0e7" stroke-width="1.5"/>
  <path d="M910 194 L738 429 L1082 429 Z" fill="none" stroke="#aabac5" stroke-width="1.5" stroke-dasharray="4 6"/>
