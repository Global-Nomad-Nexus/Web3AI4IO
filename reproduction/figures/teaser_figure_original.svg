      .small { font-size: 13px; fill: #6a7e8d; }
      .tiny { font-size: 11.5px; fill: #6a7e8d; }
      .num { font-size: 25px; font-weight: 700; }
      .hairline { stroke: #d7e1e8; stroke-width: 1.25; }
