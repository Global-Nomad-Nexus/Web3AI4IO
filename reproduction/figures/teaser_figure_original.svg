  <!-- B. Three-pillar evaluation -->
  <text x="592" y="68" class="panel-kicker">B</text>
  <text x="620" y="69" class="panel-title">Three-pillar evaluation</text>
  <text x="592" y="95" class="body">Stakeholders × data resolution × causal identification.</text>
  <rect x="592" y="111" width="56" height="3" rx="1.5" fill="#6b5a9c"/>

