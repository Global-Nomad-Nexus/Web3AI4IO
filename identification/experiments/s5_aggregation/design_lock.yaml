# plan §4 (Estimation windows) VERBATIM from
# Web3AI4IO/identification/experiment_plans/S5_temporal_aggregation.md, as required by §4
# ("正式运行前，design lock 必须逐字复制本节公式").
# Formal Monte Carlo is NOT yet run under this revision; SD_null is written into
# the managed block at the bottom by data-prep BEFORE any positive-arm simulation.

experiment: S5_temporal_aggregation
locked_at: "2026-08-14"

event:
  event_id: PUMP_PUMPSWAP_MIGRATION_20250320
  chain: Solana
  treated_market: pump_ecosystem
  controls: [raydium, orca]   # primary equal-weight control index (revised 2026-08-14)
  meteora_status: "meteora_combined excluded from primary (coverage failure, zero_day_audit.md); restricted-window sensitivity only"
  event_date: "2025-03-20"   # UTC, Thursday
  unit: DEX ecosystem-day
  raw_outcome: daily_volume_usd
  analysis_outcome: log_volume (corrected panel)

panels:
  source_panel: data/external/pumpswap/20260810/bundle/01_Pumpfun_PumpSwap_Project/pumpfun_pumpswap_did_mvp_full_local/data/processed/solana_dex_daily_did_panel.csv
  source_panel_sha256: d5cb9629c51f2781100362a130843bbaffaf26bc2dea4e4d12de1fa9697e3853
  source_requirement: "724 rows / 4 units x 181 days; immutable upstream bundle never modified"
  corrected_panel: identification/experiments/s5_aggregation/data/solana_dex_daily_did_panel_corrected.csv
  corrected_panel_rules:
    meteora_before_2025-01-17: "missing — no fill, no interpolation, no imputation from other markets"
    meteora_from_2025-01-17: "parent Meteora totalDataChart value only (includes DLMM); independent meteora-dlmm series NOT added again"
    other_markets: "unchanged; pump/raydium/orca pass the raw coverage audit (coverage_audit_primary_markets.json)"
  provenance_columns: [daily_volume_usd_original, daily_volume_usd_corrected, coverage_status, correction_reason, source_fields, log_volume_corrected]
  primary_analysis_rows: "3 markets x 181 days = 543 rows"

missing_data_policy: |
  Primary inputs 必须在整个注册窗口内 definition-consistent and observed。局部缺失不能填补。
  若某个 control 存在无法重建的 structural coverage gap，则整个 control 从 primary
  specification 排除，而不是只删除对应日期。包含该 control 的分析降为明确标注的
  restricted-window sensitivity。

meteora_sensitivity:
  calibration_window: "2025-01-17 .. 2025-03-19 (rel_day -62..-1, 62 days)"
  comparison: "two-control specification on the SAME shortened window, to separate 'adding Meteora' from 'shortening the calibration window'"
  prohibitions:
    - "不得把 Meteora 早期 missing days 删除后拼成连续 time series"
    - "bootstrap blocks 不得跨越 2025-01-17 coverage boundary"

estimand:
  target: average log ATT of pump_ecosystem vs equal-weight mean of the 2 controls over rel_day=0..6
  daily_difference: "D_t = log_volume_pump,t - mean(log_volume_raydium,t, log_volume_orca,t)"
  weekly_difference: "within unit take the daily mean over the bin, then pump minus equal-weight mean of the two controls"

estimation_windows_verbatim: |
  Daily method 使用 `rel_day=-28` 至 `6`，即 2025-02-20 至 03-26。Pre period 为 28 days，post target 为 7 days。

  Calendar-week methods 使用完整覆盖该 35-day interval 的六个 Monday-to-Sunday bins，即 2025-02-17 至 03-30。其中 2025-02-17 至 03-16 是四个纯 pre weeks，2025-03-17 至 03-23 是包含 3 pre days 与 4 target post days 的 event week，2025-03-24 至 03-30 包含剩余 3 target post days 与 4 non-target days。多出的 non-target days 只用于 bin 构造，不得计入 target truth。

  Event-aligned method 使用四个完整 pre bins，日期依次为 2025-02-20 至 02-26、02-27 至 03-05、03-06 至 03-12、03-13 至 03-19；唯一 post bin 为 03-20 至 03-26。

  Primary comparison 是 point-estimate bias、RMSE 与 paired difference，不把六个 weekly observations 的 asymptotic standard error 当作主要证据。Secondary inference 固定为对每个 generated daily panel 做 499 次 7-day moving-block bootstrap，四种 methods 在每个 draw 中共享相同 resampled blocks；使用 percentile 95% interval。Interval 完全高于 0 判 `positive`，其余判 `null`。

estimators:
  daily: "beta_daily = mean(D_t, rel_day=0..6) - mean(D_t, rel_day=-28..-1)"
  naive_weekly: "mean of the two post-labelled calendar-week differences minus mean of the four pure-pre calendar-week differences; event week 2025-03-17..03-23 labelled post although 3 of its days are pre-event"
  exposure_weighted_weekly: "OLS of D_w on exposure_w over the six calendar weeks: D_w = alpha + beta_exposure * exposure_w + error_w; exposures 0 (four pre weeks), 4/7 (event week), 3/7 (following week) at the Thursday primary"
  event_aligned: "beta_aligned = difference of bin 2025-03-20..03-26 minus mean of the four pre seven-day bin differences"

dgp:
  calibration_window: rel_day=-90..-1 (pre-event only, 3-market primary panel)
  fit: "log_volume[u,t] = unit_fe[u] + weekday_effect[weekday(t)] + day_shock[t] + residual[u,t]; two-way (unit + day) fixed effects on the balanced pre panel, day effects decomposed into weekday means plus within-weekday day deviations"
  simulation: "moving-block bootstrap of the same-day 3-market residual vector, 84-day Y0 panel over rel_day=-56..27; primary block length 7, fixed sensitivity set 14/21/28 (no block length chosen by fit to the empirical benchmark)"
  effect_gate: "DELETED 2026-08-14 (daily residual SD gate was dominated by the rare Meteora zero regime and off the seven-day ATT difficulty scale)"
  arms:
    zero: "no injection; truth = 0; runs ONCE per weekday offset (not per profile)"
    substantive_transient: "pump only, rel_day=0..2, amplitude 0.30; truth = 3*0.30/7; substantive low-power arm — never stops for low power"
    substantive_persistent: "pump only, rel_day=0..6, amplitude 0.30; truth = 0.30"
    calibration_transient: "pump only, rel_day=0..2, amplitude 7T/3; truth = T"
    calibration_persistent: "pump only, rel_day=0..6, amplitude T; truth = T"
  calibration_target: "T = 0.5 x SD_null on the unified seven-day ATT estimand (day 0..6 average ATT), NOT a daily amplitude"
  sd_null_definition: "sampling SD of the daily estimator's seven-day ATT under the revised 3-market null DGP; computed with 50,000 null draws (seed 20260322) and written into the sd_null_lock block below BEFORE any positive-arm simulation; the run phase refuses positive arms if a fresh computation disagrees"
  calibration_arm_safety: "if 7T/3 exceeds the plausible range of empirical log-volume effects, do NOT truncate or ad-hoc adjust; lowering the multiplier to a smaller pre-registered value or cancelling calibration_transient requires renewed approval"
  reporting: "substantive and calibration effects reported separately, never pooled"

weekday_alignment_sensitivity:
  primary: Thursday (offset 0)
  offsets: [0, 1, 2, 3, 4, 5, 6]   # all seven reported; event weekday cycles Thu,Fri,Sat,Sun,Mon,Tue,Wed
  implementation: "calendar-week bin edges shift by the offset relative to event time (equivalently the daily Y0 is circularly shifted relative to the fixed Monday-Sunday calendar); effect path stays in event time rel_day=0..2 / 0..6"

inference:
  replications_per_cell: 2000
  cells: "5 arms x 7 offsets (zero runs once per offset)"
  bootstrap_draws_per_panel: 499
  bootstrap: "7-day moving-block bootstrap of the generated daily panel over the 42-day estimation union window (6 blocks per draw); all four methods share the same resampled blocks in every draw"
  interval: percentile 95%
  decision: "positive if interval entirely above 0, else null"

fidelity_gate:
  rule: "SD_null must lie inside at least one empirical sliding-window SD 95% MBB CI (block lengths 14/21/28, 10,000 resamples, seed 20260323); otherwise STOP and diagnose — no positive-arm simulation"
  empirical_benchmark: "56 overlapping 35-day windows over the 90 pre-event days of the 3-market D series; overlapping windows are NOT independent samples — uncertainty via MBB only"
  also_report: [residual ACF, zero-state frequency, run length, skewness, quantiles, 35-day ATT distribution, estimator SD, block-length sensitivity 7/14/21/28]

seeds:
  y0_seed: 20260320        # Y0 panels shared across arms and offsets
  bootstrap_seed: 20260321 # block-start indices shared across arms within an offset
  sd_null_seed: 20260322   # SD_null draws (locked before positive arms)
  fidelity_seed: 20260323  # MBB resamples for the empirical sliding-window SD CIs

claim_boundary: PumpSwap-panel-calibrated aggregation evaluation

