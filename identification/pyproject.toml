[project]
name = "web3ai4io-identification"
version = "0.1.0"
description = "Event registry and known-truth experiment artifacts for Web3AI4IO"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
]

[project.scripts]
validate-event-registry = "web3ai4io_identification.registry:main"
verify-pump-activation = "web3ai4io_identification.solana_rpc:main"
analyze-h0 = "web3ai4io_identification.analyze_h0:main"
analyze-h3 = "web3ai4io_identification.analyze_h3:main"
crosscheck-ladder = "web3ai4io_identification.crosscheck_ladder:main"
audit-k3 = "web3ai4io_identification.k3_subagent_audit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web3ai4io_identification"]
