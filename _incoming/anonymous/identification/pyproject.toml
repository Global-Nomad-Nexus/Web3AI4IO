[project]
name = "web3io-identification-study"
version = "0.1.0"
description = "Reproducible event registry and causal-study artifacts for identification's web3IO contribution"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
]

[project.scripts]
validate-event-registry = "web3io_identification.registry:main"
verify-pump-activation = "web3io_identification.solana_rpc:main"
analyze-h0 = "web3io_identification.analyze_h0:main"
analyze-h3 = "web3io_identification.analyze_h3:main"
crosscheck-ladder = "web3io_identification.crosscheck_ladder:main"
audit-k3 = "web3io_identification.k3_subagent_audit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web3io_identification"]
