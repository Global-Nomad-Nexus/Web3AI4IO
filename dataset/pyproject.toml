[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web3ai4io-dataset"
version = "0.1.0"
description = "Canonical and extensible multi-chain token launchpad dataset pipeline"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.3",
  "pyarrow>=20",
  "pytest>=8",
  "requests>=2.32"
]

[project.optional-dependencies]
publish = ["huggingface-hub>=0.34"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
