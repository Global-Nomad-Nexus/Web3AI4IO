[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustworthy-launchpads-application"
version = "0.2.0"
description = "Pump.fun/PumpSwap application arm for trustworthy causal inference benchmark."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "matplotlib>=3.7",
  "statsmodels>=0.14",
  "pyfixest>=0.30",
  "scipy>=1.12",
  "requests>=2.32"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
